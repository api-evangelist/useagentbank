        amount_modes:
          exact_source: source.amount is fixed; destination amount is quoted.
          exact_destination: destination.amount is fixed; required source amount is quoted.
        wallet_policy:
          daily_limit:
            currency: USD
            amount: '500'
            window: UTC day
            scope: payer wallet
            enforcement: cumulative settled x402 amount
  /api/public/x402/payments:
    get:
      operationId: listPublicX402Payouts
      summary: List payouts funded by the authenticated wallet
      description: 'Returns lightweight history for the payer wallet. This is a standard SIGN-IN-WITH-X (SIWX) route: call once without the header for a 402 SIWX challenge, then retry with its signed wallet proof.'
      tags:
      - Payouts
      security:
      - siwx: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Payer-scoped payout history.
          content:
            application/json:
              schema:
                type: object
                required:
                - payer_address
                - payments
                properties:
                  payer_address:
                    type: string
                  payments:
                    type: array
                    items:
                      type: object
                      required:
                      - flow_id
                      - payment_id
                      - state
                      - terminal
                      - amount_mode
                      - source
                      - destination
                      - created_at
                      - updated_at
                      properties:
                        flow_id:
                          type: string
                        payment_id:
                          type:
                          - string
                          - 'null'
                        state:
                          type: string
                        terminal:
                          type: boolean
                        amount_mode:
                          type: string
                          enum:
                          - exact_source
                          - exact_destination
                        source:
                          type: object
                        destination:
                          type: object
                        created_at:
                          type: integer
                        updated_at:
                          type: integer
        '402':
          description: SIGN-IN-WITH-X proof is required or invalid. PAYMENT-REQUIRED carries a fresh SIWX challenge.
  /api/public/x402/payments/{flowId}:
    get:
      operationId: getPublicX402Payout
      summary: Get one payer-owned payout
      description: Returns the latest payment state and outcome only when a signed SIWX proof belongs to the payer wallet that funded this flow.
      tags:
      - Payouts
      security:
      - siwx: []
      parameters:
      - name: flowId
        in: path
        required: true
        schema:
          type: string
          example: pxf_0123456789abcdef
      responses:
        '200':
          description: Payout state and payment outcome.
          content:
            application/json:
              schema:
                type: object
                required:
                - flow_id
                - payment_id
                - state
                - terminal
                properties:
                  flow_id:
                    type: string
                  payment_id:
                    type:
                    - string
                    - 'null'
                  state:
                    type: string
                  terminal:
                    type: boolean
                  payment_instruction:
                    type:
                    - object
                    - 'null'
                  failure:
                    type:
                    - object
                    - 'null'
                additionalProperties: true
        '402':
          description: SIGN-IN-WITH-X proof is required or invalid. PAYMENT-REQUIRED carries a fresh SIWX challenge.
        '404':
          description: Flow does not exist or is not owned by this payer
components:
  schemas:
    PublicX402BazaarDiscovery:
      type: object
      required:
      - state
      - discovery
      - message
      properties:
        state:
          type: string
          const: payment_required
        discovery:
          type: boolean
          const: true
        message:
          type: string
    PublicX402PaymentRequired:
      type: object
      required:
      - flow_id
      - payment_id
      - state
      - payment_instruction
      properties:
        flow_id:
          type: string
        payment_id:
          type: string
        state:
          type: string
          const: payment_required
        payment_instruction:
          type: object
          description: Server-generated crypto deposit instruction.
    PublicX402ExactSourceStart:
      type: object
      required:
      - action
      - amount_mode
      - source
      - destination
      properties:
        action:
          type: string
          const: start
          default: start
        flow_id:
          type: string
          description: Returned by the 402 and required on the signed retry.
        amount_mode:
          type: string
          const: exact_source
          default: exact_source
        source:
          type: object
          required:
          - asset
          - amount
          default:
            asset:
              type: crypto
              ticker: USDC
              chain: base
            amount: '0.08'
          properties:
            asset:
              type: object
              required:
              - type
              - ticker
              - chain
              default:
                type: crypto
                ticker: USDC
                chain: base
              properties:
                type:
                  type: string
                  const: crypto
                  default: crypto
                ticker:
                  type: string
                  const: USDC
                  default: USDC
                chain:
                  type: string
                  const: base
                  default: base
            amount:
              type: string
              pattern: ^[0-9]+(?:\.[0-9]+)?$
              default: '0.08'
              description: Required when amount_mode is exact_source.
        destination:
          type: object
          required:
          - asset
          - country
          - recipient
          default:
            asset:
              type: fiat
              symbol: IDR
            country: ID
            recipient:
              payment_instrument: qr
              qr_content: 00020101021126610014COM.GO-JEK.WWW01189360091435523135470210G5523135470303UMI51440014ID.CO.QRIS.WWW0215ID10243572625090303UMI5204794153033605802ID5925RONIN STRENGTH GYM, PGDAN6009TANGERANG61051533962070703A036304FB88
              qr_dynamic: false
          properties:
            asset:
              type: object
              required:
              - type
              - symbol
              default:
                type: fiat
                symbol: IDR
              properties:
                type:
                  type: string
                  const: fiat
                  default: fiat
                symbol:
                  type: string
                  const: IDR
                  default: IDR
            country:
              type: string
              const: ID
              default: ID
            amount:
              type: string
              pattern: ^[0-9]+(?:\.[0-9]+)?$
              description: Required when amount_mode is exact_destination.
            recipient:
              type: object
              required:
              - payment_instrument
              - qr_content
              default:
                payment_instrument: qr
                qr_content: 00020101021126610014COM.GO-JEK.WWW01189360091435523135470210G5523135470303UMI51440014ID.CO.QRIS.WWW0215ID10243572625090303UMI5204794153033605802ID5925RONIN STRENGTH GYM, PGDAN6009TANGERANG61051533962070703A036304FB88
                qr_dynamic: false
              properties:
                payment_instrument:
                  type: string
                  const: qr
                  default: qr
                qr_content:
                  type: string
                qr_dynamic:
                  type: boolean
                  default: false
    PublicX402FundingSubmitted:
      type: object
      required:
      - flow_id
      - payment_id
      - state
      - terminal
      properties:
        flow_id:
          type: string
        payment_id:
          type: string
        state:
          type: string
          const: funding_submitted
        terminal:
          type: boolean
          const: false
  securitySchemes:
    siwx:
      type: apiKey
      in: header
      name: SIGN-IN-WITH-X
      description: Base64-encoded CAIP-122 wallet proof. Make an unsigned request first to receive a fresh SIWX challenge in PAYMENT-REQUIRED, then sign and retry.
