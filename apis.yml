aid: useagentbank
name: AgentBank
image: https://useagentbank.com/opengraph-image.jpg?opengraph-image.38-a9x557i8hq.jpg
description: AgentBank provides crypto‑backed banking services tailored for AI agents, enabling them to collect, hold, convert, and move money
  across the real‑world financial system. Through its Model Context Protocol (MCP) API, agents can initiate payments to bank accounts, QR codes,
  and crypto wallets, with human owners approving transactions and enforcing spending limits. The platform supports cross‑border stablecoin payments,
  compliance with financial regulations, and offers developer tools for seamless integration.
